name: Python quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check import order
        run: python -m isort --check-only main.py services prompts scripts tests
      - name: Check formatting
        run: python -m black --check main.py services prompts scripts tests
      - name: Check style
        run: python -m flake8 main.py services prompts scripts tests
      - name: Check bugs and modernization
        run: python -m ruff check main.py services prompts scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
