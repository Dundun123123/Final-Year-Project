<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 知屿</title><link rel="stylesheet" href="/static/entry.css"></head><body class="entry login-page"><header class="entry-nav"><a class="entry-brand" href="/main"><span>知</span><b>知屿 · Knowledge Island</b></a><div><button class="language-toggle" data-lang-toggle type="button">EN</button><a href="/main" class="entry-login">返回首页</a></div></header><main class="login-wrap"><section><p class="landing-note">进入你的学习空间</p><h1 id="authTitle">登录</h1><p id="authHint">使用本机账号继续阅读你的课程资料。</p><form id="authForm"><label>用户名<input name="username" autocomplete="username" required minlength="2" placeholder="输入用户名"></label><label>密码<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位"></label><button id="authSubmit" class="entry-primary">登录并进入</button></form><p id="authMessage" class="auth-message"></p><button id="authToggle" class="auth-toggle" type="button">第一次使用？创建本机账号</button></section></main><script>let register=false;const $=s=>document.querySelector(s);$('#authToggle').onclick=()=>{register=!register;$('#authTitle').textContent=register?'创建本机账号':'登录';$('#authHint').textContent=register?'账号和资料只保存在当前电脑。':'使用本机账号继续阅读你的课程资料。';$('#authSubmit').textContent=register?'创建账号并进入':'登录并进入';$('#authToggle').textContent=register?'已有账号？直接登录':'第一次使用？创建本机账号';$('#authForm').password.autocomplete=register?'new-password':'current-password';$('#authMessage').textContent=''};$('#authForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const message=$('#authMessage');try{const r=await fetch(register?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.detail);sessionStorage.setItem('course-kb-user',data.username);location.href='/app'}catch(err){message.textContent=err.message}};</script><script src="/static/lang.js"></script></body></html>
